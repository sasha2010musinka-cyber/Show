name: Build plugin

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack zip
        run: |
          ZIP=$(ls -1 *.zip 2>/dev/null | head -n1)
          if [ -z "$ZIP" ]; then echo "В корне репозитория нет .zip файла"; exit 1; fi
          echo "Распаковываю: $ZIP"
          rm -rf _src && mkdir -p _src
          unzip -o "$ZIP" -d _src
          GRADLE_FILE=$(find _src -name build.gradle | head -n1)
          if [ -z "$GRADLE_FILE" ]; then echo "В архиве нет build.gradle"; exit 1; fi
          echo "PROJECT_DIR=$(dirname "$GRADLE_FILE")" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle build --no-daemon

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: NovaShow-plugin
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar
